name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Testy (pytest)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v5
      - name: Build obrazu
        run: docker build -t apteki-teraz .
      - name: Smoke test na próbce danych
        run: |
          docker run -d --name app -p 8000:8000 apteki-teraz \
            sh -c "python scripts/fetch_data.py --sample && uvicorn apteki.api:app --host 0.0.0.0 --port 8000"
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs "localhost:8000/api/search?q=krakow" | grep -q '"total":3'
